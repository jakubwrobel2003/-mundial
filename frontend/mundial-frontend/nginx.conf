server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver Google DNS – wymagany gdy upstream to zmienna (Railway public URL)
    resolver 8.8.8.8 8.8.4.4 valid=30s ipv6=off;

    location /api/ {
        set $backend "${BACKEND_INTERNAL_URL}";
        proxy_pass         $backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
