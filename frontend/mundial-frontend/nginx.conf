server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls do backendu (URL wstrzykiwany przez entrypoint.sh)
    location /api/ {
        proxy_pass         ${BACKEND_INTERNAL_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Angular SPA – wszystkie inne ścieżki → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets z hash w nazwie (output-hashing Angular)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Brak cache dla index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
